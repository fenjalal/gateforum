{% extends "base.html" %}
{% block title %}Payment cancelled · {{ site_title or 'GateForum' }}{% endblock %}
{% block content %}
{% import "_icons.html" as i %}
<div class="auth" style="max-width:440px">
  <div class="panel status">
    <div class="status-mark bad">{{ i.xcircle() }}</div>
    <h1>Payment cancelled</h1>
    <p>Nothing was charged. You can try again any time.</p>
    <div class="btn-row" style="justify-content:center;margin-top:20px">
      <a href="{{ url_for('contributor_dashboard') }}" class="btn btn-primary">Back to my posts</a>
    </div>
  </div>
</div>
{% endblock %}
