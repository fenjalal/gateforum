{% extends "base.html" %}
{% block title %}Claim key · {{ site_title or 'GateForum' }}{% endblock %}
{% block content %}
<div class="auth">
  <div class="panel">
    <h1>Claim this key</h1>
    <p class="lead">Key <strong>{{ token.label }}</strong>. Pick the name people will see.</p>
    {% if error %}<div class="notice notice-err" role="alert">{{ error }}</div>{% endif %}
    <form method="POST" autocomplete="off">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <div class="field">
        <label for="dn">Display name</label>
        <input id="dn" type="text" name="display_name" required autofocus autocomplete="off" placeholder="2 to 50 letters" maxlength="50" minlength="2" pattern="[^<>&quot;']{2,50}">
      </div>
      <div class="btn-row">
        <button type="submit" class="btn btn-primary">Claim key</button>
        <a href="{{ url_for('token_login') }}" class="btn btn-quiet">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
